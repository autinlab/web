        <h1>Ludo's Molecular Graphics Lab at Scripps Research</h1>
        <p>Ludo's Molecular Graphics Lab (Ludo's MGL), led by Ludovic Autin, PhD, Institute Investigator, is a research group at Scripps Research in La Jolla, California. We build tools to model, simulate and paint the molecular world, from cellPACK to Mesoscope. Our work combines integrative modeling (building structural models of macromolecular assemblies from several experimental sources), GPU computing to simulate and visualize cellular environments, and molecular graphics to illustrate the crowded biological mesoscale.</p>
        <p>Our tools include <a href="https://autinlab.org/cellpack.html" style="color:#2dd4bf">cellPACK</a>, a virtual mesoscope that packs molecular structures into cellular compartments; <a href="https://autinlab.org/mesoscope.html" style="color:#2dd4bf">Mesoscope</a>, a web-based explorer for mesoscale biological models; CellPackGPU, GPU-accelerated packing used to build whole-cell models of Mycoplasma genitalium; Illustrate, non-photorealistic rendering of biomolecules; CellPaint, a digital painting tool for molecular landscapes; and ePMV, the embedded Python Molecular Viewer for Blender, Maya and Cinema 4D. We also contribute to Mesoscale Explorer, built on Mol*.</p>
        <p>The lab continues the legacy of the Molecular Graphics Laboratory (MGL) founded by Art Olson and continued by David Goodsell at Scripps Research. Our integrative models include HIV-1, the blood plasma exosome, insulin secretory granules, Mycoplasma genitalium, Influenza A and SARS-CoV-2.</p>
        <p><a href="https://autinlab.org/cellpack.html" style="color:#2dd4bf">cellPACK</a> · <a href="https://autinlab.org/mesoscope.html" style="color:#2dd4bf">Mesoscope</a> · <a href="https://autinlab.org/labintern.html" style="color:#2dd4bf">Internships</a> · <a href="https://github.com/autinlab" style="color:#2dd4bf">GitHub</a> · <a href="mailto:autin@scripps.edu" style="color:#2dd4bf">autin@scripps.edu</a></p>
